<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveling Glass Audio Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #121212; 
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Space Mono', monospace;
            color: white;
            user-select: none;
        }

        .outer-shell {
            background: #181818;
            padding: 12px;
            border-radius: 54px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 2px rgba(255, 255, 255, 0.02),
                inset 0 -1px 2px rgba(0, 0, 0, 0.5);
        }

        .inner-glass {
            background: linear-gradient(160deg, #2a2a2c 0%, #161616 100%);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 42px;
            padding: 40px 30px;
            width: 280px; /* Thoda wide kiya hai taaki wave ka safar aur acha dikhe */
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
            position: relative;
        }

        /* Canvas ab pure container par faila hai waves scroll karne ke liye */
        canvas {
            width: 100%;
            height: 100px;
            margin-bottom: 30px;
            display: block;
        }

        .info-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
            width: 100%;
        }

        .time-display {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
            z-index: 2;
        }

        .status-text {
            font-size: 10px;
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.4;
            font-family: sans-serif;
            font-weight: 600;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px; 
            width: 100%;
        }

        .btn {
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease, background 0.2s ease;
        }

        .btn:active { transform: scale(0.92); }

        .dark-btn {
            background: linear-gradient(145deg, #333333, #1f1f1f);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            width: 60px;
            height: 60px;
            color: white;
        }

        .dark-btn:hover { background: linear-gradient(145deg, #3a3a3a, #262626); }

        .dark-btn svg {
            fill: none; stroke: #ddd; stroke-width: 2;
            stroke-linecap: round; stroke-linejoin: round;
            width: 22px; height: 22px;
        }

        .red-btn {
            background: #ff3b30;
            width: 76px; height: 76px;
            box-shadow: 0 8px 20px rgba(255, 59, 48, 0.35), inset 0 2px 4px rgba(255, 255, 255, 0.2);
        }

        .red-btn:hover { background: #ff4f45; }

        .red-btn svg { fill: white; width: 28px; height: 28px; stroke: none; }

        #stopBtn svg { fill: #ddd; stroke: none; width: 16px; height: 16px; border-radius: 2px; }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="outer-shell">
        <div class="inner-glass">
            <!-- 400x120 High Res for crisp lines -->
            <canvas id="waveformCanvas" width="400" height="120"></canvas>
            
            <div class="info-row">
                <span class="time-display" id="currentTime">00:00</span>
                <div class="status-text" id="statusText">NO AUDIO<br>SELECTED</div>
            </div>

            <div class="controls">
                <!-- Clean Upload/Select Icon -->
                <button class="btn dark-btn" id="uploadBtn" title="Load Audio">
                    <svg viewBox="0 0 24 24">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                </button>
                
                <button class="btn red-btn" id="playPauseBtn">
                    <svg id="playIcon" viewBox="0 0 24 24" style="margin-left: 4px;"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;">
                        <rect x="6" y="5" width="4" height="14" rx="1"></rect>
                        <rect x="14" y="5" width="4" height="14" rx="1"></rect>
                    </svg>
                </button>
                
                <button class="btn dark-btn" id="stopBtn" title="Stop & Remove">
                    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg>
                </button>
            </div>

            <input type="file" id="audioInput" accept="audio/*">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('waveformCanvas');
        const ctx = canvas.getContext('2d');
        const audioInput = document.getElementById('audioInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const timeDisplay = document.getElementById('currentTime');
        const statusText = document.getElementById('statusText');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');

        const audio = new Audio();
        let audioContext;
        
        // ----------------------------------------
        // MATH FOR TRAVELING & MAGNIFIER WAVEFORM
        // ----------------------------------------
        const barWidth = 3.5;
        const gap = 3.5;
        const barTotal = barWidth + gap;
        
        // Canvas par ek baar me kitne seconds ka wave dikhega (10 seconds total: 5s left, 5s right)
        const visibleTime = 10; 
        const pxPerSec = canvas.width / visibleTime; // Pixels travel per second (400/10 = 40px)
        const timePerBar = barTotal / pxPerSec; // Ek bar kitne time ka data dikhayega
        
        let audioPeaks = []; 
        let isDrawing = false;
        let decodedDuration = 0; // High precision duration from buffer

        // 1. File Upload & Decode Logic
        uploadBtn.addEventListener('click', () => audioInput.click());

        audioInput.addEventListener('change', async function() {
            const file = this.files[0];
            if (!file) return;

            statusText.innerHTML = "ANALYZING<br>TRACK...";
            audio.src = URL.createObjectURL(file);
            timeDisplay.textContent = "00:00";
            
            // Web Audio API se exact buffer read karke wave banayenge
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await file.arrayBuffer();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
            
            decodedDuration = audioBuffer.duration;
            extractPeaks(audioBuffer);
            
            statusText.innerHTML = "TRACK READY<br>PRESS PLAY";
            drawWaveformFrame(); 
        });

        // 2. Extract Data for Sliding Window
        function extractPeaks(buffer) {
            const rawData = buffer.getChannelData(0); 
            // Total bars needed for the entire song
            const totalBars = Math.ceil(decodedDuration / timePerBar);
            const samplesPerBar = Math.floor(rawData.length / totalBars);
            
            audioPeaks = [];

            for (let i = 0; i < totalBars; i++) {
                let peak = 0;
                const offset = i * samplesPerBar;
                // Har chunk me se max volume nikalna
                for (let j = 0; j < samplesPerBar; j++) {
                    const absVal = Math.abs(rawData[offset + j] || 0);
                    if (absVal > peak) peak = absVal;
                }
                audioPeaks.push(peak);
            }

            // Normalization: Scale heights so they don't break canvas when magnified 1.5x at center
            const maxPeak = Math.max(...audioPeaks);
            const baseMaxHeight = (canvas.height * 0.55); // Limits the normal peak height
            audioPeaks = audioPeaks.map(p => (p / maxPeak) * baseMaxHeight);
        }

        // 3. Play / Pause
        playPauseBtn.addEventListener('click', () => {
            if (!audio.src) return;

            if (audio.paused) {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                statusText.innerHTML = "NOW PLAYING<br>AUDIO TRACK";
                if (!isDrawing) drawWaveformLoop();
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                statusText.innerHTML = "TRACK PAUSED<br>...";
                isDrawing = false;
            }
        });

        // 4. Stop
        stopBtn.addEventListener('click', () => {
            audio.pause();
            audio.removeAttribute('src'); 
            audio.load(); 
            audioPeaks = []; 
            
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            timeDisplay.textContent = "00:00";
            statusText.innerHTML = "NO AUDIO<br>SELECTED";
            
            isDrawing = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            audioInput.value = ""; 
        });

        // 5. Time Updates
        audio.addEventListener('timeupdate', () => {
            if (!audio.src) return;
            const current = Math.floor(audio.currentTime);
            const minutes = Math.floor(current / 60).toString().padStart(2, '0');
            const seconds = (current % 60).toString().padStart(2, '0');
            timeDisplay.textContent = `${minutes}:${seconds}`;
            
            // Paused hone par slide bar manually update ho
            if(audio.paused) drawWaveformFrame(); 
        });

        audio.addEventListener('ended', () => {
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            statusText.innerHTML = "TRACK ENDED<br>PRESS PLAY";
            audio.currentTime = 0;
            isDrawing = false;
            drawWaveformFrame();
        });

        // 6. Sliding Math & Drawing Engine (The Magic)
        function drawWaveformFrame() {
            if (audioPeaks.length === 0) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerY = canvas.height / 2;
            const centerX = canvas.width / 2;

            // Center mark: Ek bohot hi light red glow playhead mark karne ke liye
            let gradient = ctx.createLinearGradient(centerX, centerY - 20, centerX, centerY + 20);
            gradient.addColorStop(0, "rgba(255, 59, 48, 0)");
            gradient.addColorStop(0.5, "rgba(255, 59, 48, 0.4)");
            gradient.addColorStop(1, "rgba(255, 59, 48, 0)");
            ctx.fillStyle = gradient;
            ctx.fillRect(centerX - 15, 0, 30, canvas.height);

            const currTime = audio.currentTime || 0;
            
            // Konse bars screen par dikhne chahiye (Start to End limit)
            const startBar = Math.floor((currTime - visibleTime / 2) / timePerBar);
            const endBar = Math.ceil((currTime + visibleTime / 2) / timePerBar);

            for (let i = startBar; i <= endBar; i++) {
                if (i < 0 || i >= audioPeaks.length) continue; // Out of bounds skip

                // Wave ko smooth slide karne ka main logic
                const barTime = i * timePerBar;
                const x = centerX + ((barTime - currTime) * pxPerSec); 

                // Magnifier Effect Logic based on distance from center
                const dist = Math.abs(x - centerX);
                const maxDist = centerX;
                // Ratio: 1 at exact center, 0 at the very edges
                const ratio = Math.max(0, 1 - (dist / maxDist)); 

                // Styling variations based on ratio
                // Center pe opacity 1 (100%), kinaro par 0.15 (15%)
                const opacity = 0.15 + (0.85 * ratio); 
                
                // Center pe bar ki height 1.6x badi hogi, kinaro par shrink ho jayegi
                const scale = 0.4 + (1.2 * Math.pow(ratio, 1.5)); 
                
                // Minimum bar height 2px rakhi hai taaki completely empty na lage
                let baseHeight = audioPeaks[i] > 2 ? audioPeaks[i] : 2; 
                let h = baseHeight * scale;

                // Center wale active bars halke bright white lagene
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                ctx.fillRect(x - (barWidth/2), centerY - (h / 2), barWidth, h);
            }
        }

        // 60FPS Animation Loop
        function drawWaveformLoop() {
            if(audio.paused) return; // Battery bachane ke liye pause pe loop band
            isDrawing = true;
            drawWaveformFrame();
            requestAnimationFrame(drawWaveformLoop);
        }

    </script>
</body>
</html>
