<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --red-accent: #ff3b30;
        }

        /* 1. Global Box Sizing Fix */
        *, *::before, *::after {
            box-sizing: border-box;
        }

        /* 2. Strict Page Dimensions Fix */
        html, body {
            width: 100%;
            height: 100dvh; /* Changed from 100vh to 100dvh (Dynamic Viewport) to prevent mobile height jumps */
            margin: 0;
            padding: 0;
            overflow: hidden; /* Strictly prevent any scrolling */
            background-color: #050505; 
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Mono', monospace;
            color: white;
            user-select: none;
            position: relative;
        }

        /* 3. Restricted Ambient Glow */
        .ambient-bg {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(255,59,48,0.15) 0%, rgba(50,50,255,0.05) 40%, transparent 70%);
            filter: blur(60px);
            z-index: 0;
            animation: float 10s infinite alternate ease-in-out;
            pointer-events: none; /* Prevents touch interference */
        }

        @keyframes float {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        .outer-shell {
            background: rgba(30, 30, 35, 0.4);
            padding: 14px;
            border-radius: 54px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            z-index: 1;
            position: relative;
        }

        .inner-glass {
            background: rgba(20, 20, 22, 0.5);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 42px;
            padding: 40px 25px;
            
            /* 4. Fixed Container Size Fix */
            width: 320px; 
            height: 380px; /* Fixed height so changing states doesn't shrink/grow the container */
            max-width: 90vw; /* Keeps it safe on very small phones */
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden; 
            
            /* Removed 'transition: all' to stop the layout jitter bug */
        }

        /* --- STATE 1: UPLOAD UI --- */
        #uploadState {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; gap: 20px; width: 100%; height: 100%;
        }

        .upload-text {
            font-size: 14px; color: #ddd; letter-spacing: 1px; font-family: sans-serif; font-weight: 600;
        }

        /* --- STATE 2: PLAYER UI --- */
        #playerState {
            display: none; flex-direction: column; align-items: center; justify-content: space-between; 
            width: 100%; height: 100%; padding: 10px 0;
        }

        canvas {
            width: 100%; height: 100px; display: block;
        }

        .info-row {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%;
        }

        .time-display {
            font-size: 26px; font-weight: 700; letter-spacing: -1px; width: 85px; text-align: left;
        }

        .track-title {
            font-size: 11px; color: #ddd; letter-spacing: 0.5px; font-family: sans-serif;
            font-weight: 600; text-transform: uppercase; text-align: center; flex-grow: 1;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; padding: 0 10px;
        }

        .settings-toggle {
            background: transparent; border: none; cursor: pointer; padding: 5px;
            display: flex; align-items: center; justify-content: flex-end; width: 40px;
        }
        .settings-toggle svg {
            fill: none; stroke: #aaa; stroke-width: 2; width: 24px; height: 24px; transition: stroke 0.2s;
        }
        .settings-toggle:hover svg { stroke: white; }

        .controls {
            display: flex; align-items: center; justify-content: center; gap: 15px; width: 100%; z-index: 2;
        }

        .btn {
            border: none; border-radius: 50%; cursor: pointer; display: flex; 
            align-items: center; justify-content: center; transition: transform 0.1s ease;
        }
        .btn:active { transform: scale(0.92); }

        .dark-btn {
            background: linear-gradient(145deg, rgba(60, 60, 60, 0.8), rgba(30, 30, 30, 0.8));
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.15);
            width: 60px; height: 60px; color: white;
        }
        .dark-btn svg { width: 24px; height: 24px; }

        .red-btn {
            background: var(--red-accent);
            width: 76px; height: 76px;
            box-shadow: 0 8px 20px rgba(255, 59, 48, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.2);
        }
        .red-btn svg { fill: white; width: 34px; height: 34px; stroke: none; }
        
        #stopBtn svg { width: 26px; height: 26px; }

        /* --- SETTINGS PANEL --- */
        #settingsPanel {
            position: absolute; bottom: -100%; left: 0; right: 0;
            background: rgba(20, 20, 22, 0.95); backdrop-filter: blur(15px);
            padding: 30px; border-radius: 0 0 42px 42px; border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; flex-direction: column; gap: 25px; z-index: 10;
            transition: bottom 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }
        
        #settingsPanel.active {
            bottom: 0;
        }

        .slider-group { display: flex; flex-direction: column; gap: 8px; }

        .slider-label {
            font-size: 10px; font-family: sans-serif; color: #aaa; text-transform: uppercase; 
            letter-spacing: 1px; display: flex; justify-content: space-between;
        }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.15); border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 16px; width: 16px; border-radius: 50%; background: white; cursor: pointer;
            -webkit-appearance: none; margin-top: -6px; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        input[type=range]:active::-webkit-slider-thumb { background: var(--red-accent); }
        
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <div class="outer-shell">
        <div class="inner-glass">
            
            <!-- STATE 1: UPLOAD -->
            <div id="uploadState">
                <button class="btn dark-btn" id="mainUploadBtn" style="width: 80px; height: 80px;">
                    <svg viewBox="0 0 24 24" style="fill: none; stroke: white; stroke-width: 1.5; stroke-linecap: round;">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                </button>
                <div class="upload-text">SELECT AUDIO FILE</div>
            </div>

            <!-- STATE 2: PLAYER -->
            <div id="playerState">
                <canvas id="waveformCanvas" width="400" height="120"></canvas>
                
                <div class="info-row">
                    <span class="time-display" id="currentTime">00:00</span>
                    <div class="track-title" id="trackTitle">Track Name</div>
                    
                    <button class="settings-toggle" id="settingsBtn">
                        <svg viewBox="0 0 24 24">
                            <line x1="4" y1="21" x2="4" y2="14"></line>
                            <line x1="4" y1="10" x2="4" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12" y2="3"></line>
                            <line x1="20" y1="21" x2="20" y2="16"></line>
                            <line x1="20" y1="12" x2="20" y2="3"></line>
                            <line x1="1" y1="14" x2="7" y2="14"></line>
                            <line x1="9" y1="8" x2="15" y2="8"></line>
                            <line x1="17" y1="16" x2="23" y2="16"></line>
                        </svg>
                    </button>
                </div>

                <div class="controls">
                    <button class="btn dark-btn" id="stopBtn" title="Stop & Remove">
                        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" fill="#ddd"></rect></svg>
                    </button>
                    
                    <button class="btn red-btn" id="playPauseBtn">
                        <svg id="playIcon" viewBox="0 0 24 24" style="margin-left: 4px;"><path d="M8 5v14l11-7z"/></svg>
                        <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;">
                            <rect x="6" y="5" width="4" height="14" rx="1"></rect>
                            <rect x="14" y="5" width="4" height="14" rx="1"></rect>
                        </svg>
                        <svg id="replayIcon" viewBox="0 0 24 24" style="display: none;">
                            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                        </svg>
                    </button>
                    
                    <button class="btn dark-btn" id="changeTrackBtn" title="Change Audio">
                        <svg viewBox="0 0 24 24" style="fill: none; stroke: #ddd; stroke-width: 2; stroke-linecap: round;">
                            <path d="M9 18V5l12-2v13"></path>
                            <circle cx="6" cy="18" r="3"></circle>
                            <circle cx="18" cy="16" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <!-- SETTINGS PANEL -->
                <div id="settingsPanel">
                    <div class="slider-group">
                        <div class="slider-label"><span>Volume</span><span id="volVal">100%</span></div>
                        <input type="range" id="volSlider" min="0" max="1" step="0.01" value="1">
                    </div>
                    <div class="slider-group">
                        <div class="slider-label"><span>Speed</span><span id="speedVal">1.0x</span></div>
                        <input type="range" id="speedSlider" min="0.5" max="2" step="0.1" value="1">
                    </div>
                </div>
            </div>

            <input type="file" id="audioInput" accept="audio/*">
        </div>
    </div>

    <script>
        const uploadState = document.getElementById('uploadState');
        const playerState = document.getElementById('playerState');
        const audioInput = document.getElementById('audioInput');
        const mainUploadBtn = document.getElementById('mainUploadBtn');
        const changeTrackBtn = document.getElementById('changeTrackBtn');
        
        const canvas = document.getElementById('waveformCanvas');
        const ctx = canvas.getContext('2d');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const timeDisplay = document.getElementById('currentTime');
        const trackTitle = document.getElementById('trackTitle');
        
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const replayIcon = document.getElementById('replayIcon');

        const settingsBtn = document.getElementById('settingsBtn');
        const settingsPanel = document.getElementById('settingsPanel');
        const volSlider = document.getElementById('volSlider');
        const speedSlider = document.getElementById('speedSlider');
        const volVal = document.getElementById('volVal');
        const speedVal = document.getElementById('speedVal');

        const audio = new Audio();
        let audioContext;
        
        const barWidth = 4;
        const gap = 3;
        const barTotal = barWidth + gap;
        const visibleTime = 10; 
        const pxPerSec = canvas.width / visibleTime; 
        const timePerBar = barTotal / pxPerSec; 
        
        let audioPeaks = []; 
        let isDrawing = false;
        let decodedDuration = 0; 
        let isSettingsOpen = false;

        mainUploadBtn.addEventListener('click', () => audioInput.click());
        changeTrackBtn.addEventListener('click', () => audioInput.click());

        audioInput.addEventListener('change', async function() {
            const file = this.files[0];
            if (!file) return;

            let cleanName = file.name.replace(/\.[^/.]+$/, "");
            trackTitle.textContent = cleanName;

            uploadState.style.display = 'none';
            playerState.style.display = 'flex';
            
            audio.src = URL.createObjectURL(file);
            timeDisplay.textContent = "00:00";
            
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            replayIcon.style.display = 'none';
            
            settingsPanel.classList.remove('active');
            isSettingsOpen = false;

            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await file.arrayBuffer();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
            
            decodedDuration = audioBuffer.duration;
            extractPeaks(audioBuffer);
            drawWaveformFrame(); 
        });

        settingsBtn.addEventListener('click', () => {
            isSettingsOpen = !isSettingsOpen;
            if(isSettingsOpen) {
                settingsPanel.classList.add('active');
            } else {
                settingsPanel.classList.remove('active');
            }
        });

        volSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
            volVal.textContent = Math.round(e.target.value * 100) + '%';
        });

        speedSlider.addEventListener('input', (e) => {
            audio.playbackRate = e.target.value;
            speedVal.textContent = parseFloat(e.target.value).toFixed(1) + 'x';
        });

        playPauseBtn.addEventListener('click', () => {
            if (!audio.src) return;

            if (audio.ended) audio.currentTime = 0;

            if (audio.paused) {
                audio.play();
                playIcon.style.display = 'none';
                replayIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                
                settingsPanel.classList.remove('active');
                isSettingsOpen = false;
                
                if (!isDrawing) drawWaveformLoop();
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                replayIcon.style.display = 'none';
                isDrawing = false;
            }
        });

        stopBtn.addEventListener('click', () => {
            audio.pause();
            audio.removeAttribute('src'); 
            audio.load(); 
            audioPeaks = []; 
            
            uploadState.style.display = 'flex';
            playerState.style.display = 'none';
            
            settingsPanel.classList.remove('active');
            isSettingsOpen = false;
            
            isDrawing = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            audioInput.value = ""; 
        });

        audio.addEventListener('timeupdate', () => {
            if (!audio.src) return;
            const current = Math.floor(audio.currentTime);
            const minutes = Math.floor(current / 60).toString().padStart(2, '0');
            const seconds = (current % 60).toString().padStart(2, '0');
            timeDisplay.textContent = `${minutes}:${seconds}`;
            if(audio.paused) drawWaveformFrame(); 
        });

        audio.addEventListener('ended', () => {
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'none';
            replayIcon.style.display = 'block'; 
            isDrawing = false;
            drawWaveformFrame();
        });

        function extractPeaks(buffer) {
            const rawData = buffer.getChannelData(0); 
            const totalBars = Math.ceil(decodedDuration / timePerBar);
            const samplesPerBar = Math.floor(rawData.length / totalBars);
            
            audioPeaks = [];
            for (let i = 0; i < totalBars; i++) {
                let peak = 0;
                const offset = i * samplesPerBar;
                for (let j = 0; j < samplesPerBar; j++) {
                    const absVal = Math.abs(rawData[offset + j] || 0);
                    if (absVal > peak) peak = absVal;
                }
                audioPeaks.push(peak);
            }

            const maxPeak = Math.max(...audioPeaks);
            const baseMaxHeight = (canvas.height * 0.7); 
            audioPeaks = audioPeaks.map(p => (p / maxPeak) * baseMaxHeight);
        }

        function drawWaveformFrame() {
            if (audioPeaks.length === 0) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerY = canvas.height / 2;
            const centerX = canvas.width / 2;

            const currTime = audio.currentTime || 0;
            const startBar = Math.floor((currTime - visibleTime / 2) / timePerBar);
            const endBar = Math.ceil((currTime + visibleTime / 2) / timePerBar);

            for (let i = startBar; i <= endBar; i++) {
                if (i < 0 || i >= audioPeaks.length) continue; 

                const barTime = i * timePerBar;
                const x = centerX + ((barTime - currTime) * pxPerSec); 
                const distInSeconds = Math.abs(barTime - currTime);
                
                let opacity = 0.15; 
                if (distInSeconds <= 2.5) {
                    opacity = 1.0; 
                }

                const distRatio = Math.max(0, 1 - (distInSeconds / (visibleTime / 2))); 
                const scale = 0.6 + (0.7 * distRatio); 
                
                let baseHeight = audioPeaks[i] > 2 ? audioPeaks[i] : 2; 
                let h = baseHeight * scale;

                ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
                ctx.fillRect(x - (barWidth/2), centerY - (h / 2), barWidth, h);
            }
        }

        function drawWaveformLoop() {
            if(audio.paused) return; 
            isDrawing = true;
            drawWaveformFrame();
            requestAnimationFrame(drawWaveformLoop);
        }

    </script>
</body>
</html>
