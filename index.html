<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True Glass Audio Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #121212; 
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Space Mono', monospace;
            color: white;
            user-select: none;
        }

        .outer-shell {
            background: #181818;
            padding: 12px;
            border-radius: 54px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 2px rgba(255, 255, 255, 0.02),
                inset 0 -1px 2px rgba(0, 0, 0, 0.5);
        }

        .inner-glass {
            background: linear-gradient(160deg, #2a2a2c 0%, #161616 100%);
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 42px;
            padding: 40px 30px;
            width: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        canvas {
            width: 100%;
            height: 80px;
            margin-bottom: 30px;
            display: block;
            cursor: pointer; /* Added pointer cursor for visual feedback */
        }

        .info-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
            width: 100%;
        }

        .time-display {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .status-text {
            font-size: 10px;
            color: #888;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.4;
            font-family: sans-serif;
            font-weight: 600;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px; 
            width: 100%;
        }

        .btn {
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease, background 0.2s ease;
        }

        .btn:active {
            transform: scale(0.92);
        }

        .dark-btn {
            background: linear-gradient(145deg, #333333, #1f1f1f);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            width: 60px;
            height: 60px;
            color: white;
        }

        .dark-btn:hover { background: linear-gradient(145deg, #3a3a3a, #262626); }

        .dark-btn svg {
            fill: none; stroke: #ddd; stroke-width: 1.8;
            stroke-linecap: round; stroke-linejoin: round;
            width: 22px; height: 22px;
        }

        .red-btn {
            background: #ff3b30;
            width: 76px; height: 76px;
            box-shadow: 0 8px 20px rgba(255, 59, 48, 0.35), inset 0 2px 4px rgba(255, 255, 255, 0.2);
        }

        .red-btn:hover { background: #ff4f45; }

        .red-btn svg { fill: white; width: 28px; height: 28px; }

        #stopBtn svg { fill: #ddd; stroke: none; width: 16px; height: 16px; border-radius: 2px; }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="outer-shell">
        <div class="inner-glass">
            <canvas id="waveformCanvas" width="400" height="120"></canvas>
            
            <div class="info-row">
                <span class="time-display" id="currentTime">00:00</span>
                <div class="status-text" id="statusText">NO AUDIO<br>SELECTED</div>
            </div>

            <div class="controls">
                <button class="btn dark-btn" id="uploadBtn" title="Load Audio">
                    <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                </button>
                
                <button class="btn red-btn" id="playPauseBtn">
                    <svg id="playIcon" viewBox="0 0 24 24" style="margin-left: 4px;"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;">
                        <rect x="6" y="5" width="4" height="14" rx="1"></rect>
                        <rect x="14" y="5" width="4" height="14" rx="1"></rect>
                    </svg>
                </button>
                
                <button class="btn dark-btn" id="stopBtn" title="Stop & Remove">
                    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg>
                </button>
            </div>

            <input type="file" id="audioInput" accept="audio/*">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('waveformCanvas');
        const ctx = canvas.getContext('2d');
        const audioInput = document.getElementById('audioInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const timeDisplay = document.getElementById('currentTime');
        const statusText = document.getElementById('statusText');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');

        // Audio Elements
        const audio = new Audio();
        let audioContext;
        
        // Waveform Math
        const barWidth = 4;
        const gap = 3;
        const totalBars = Math.floor(canvas.width / (barWidth + gap));
        let audioPeaks = []; // Yahan poori audio file ki peaks store hongi
        let isDrawing = false;

        // 1. File Upload & Decode Logic
        uploadBtn.addEventListener('click', () => audioInput.click());

        audioInput.addEventListener('change', async function() {
            const file = this.files[0];
            if (!file) return;

            statusText.innerHTML = "ANALYZING<br>TRACK...";
            
            // Create object URL for normal HTML5 playing
            const objectUrl = URL.createObjectURL(file);
            audio.src = objectUrl;
            
            // Initial UI reset
            timeDisplay.textContent = "00:00";
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';

            // Decode file for waveform extraction
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await file.arrayBuffer();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
            
            extractPeaks(audioBuffer);
            
            statusText.innerHTML = "TRACK READY<br>PRESS PLAY";
            drawWaveformFrame(); // Draw the low-opacity waveform
        });

        // 2. Extract Peaks from full audio file
        function extractPeaks(buffer) {
            const rawData = buffer.getChannelData(0); // Pehle channel ka data lenge
            const samplesPerBar = Math.floor(rawData.length / totalBars);
            audioPeaks = [];

            for (let i = 0; i < totalBars; i++) {
                let peak = 0;
                const offset = i * samplesPerBar;
                // Har chunk me se sabse oonchi aawaz (peak) dhoondenge
                for (let j = 0; j < samplesPerBar; j++) {
                    const absVal = Math.abs(rawData[offset + j]);
                    if (absVal > peak) peak = absVal;
                }
                audioPeaks.push(peak);
            }

            // Normalize peaks taaki sabse uncha bar screen se bahar na jaye
            const maxPeak = Math.max(...audioPeaks);
            audioPeaks = audioPeaks.map(p => (p / maxPeak) * (canvas.height * 0.8)); // 80% height limit
        }

        // 3. Play / Pause Logic
        playPauseBtn.addEventListener('click', () => {
            if (!audio.src) return;

            if (audio.paused) {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                statusText.innerHTML = "NOW PLAYING<br>AUDIO TRACK";
                if (!isDrawing) drawWaveformLoop();
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                statusText.innerHTML = "TRACK PAUSED<br>...";
                isDrawing = false;
            }
        });

        // 4. Stop & Clear
        stopBtn.addEventListener('click', () => {
            audio.pause();
            audio.removeAttribute('src'); 
            audio.load(); 
            audioPeaks = []; // Waveform data clear karna
            
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            timeDisplay.textContent = "00:00";
            statusText.innerHTML = "NO AUDIO<br>SELECTED";
            
            isDrawing = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Canvas clean
            audioInput.value = ""; 
        });

        // 5. Timer Updates
        audio.addEventListener('timeupdate', () => {
            if (!audio.src) return;
            const current = Math.floor(audio.currentTime);
            const minutes = Math.floor(current / 60).toString().padStart(2, '0');
            const seconds = (current % 60).toString().padStart(2, '0');
            timeDisplay.textContent = `${minutes}:${seconds}`;
            
            // Jab audio play ho rahi hoti hai toh timeupdate par bhi draw karte hain
            // taaki exact frame match ho progress ke sath.
            if(audio.paused) drawWaveformFrame(); 
        });

        audio.addEventListener('ended', () => {
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            statusText.innerHTML = "TRACK ENDED<br>PRESS PLAY";
            audio.currentTime = 0;
            isDrawing = false;
            drawWaveformFrame();
        });

        // 6. Drawing The Pre-calculated Waveform
        function drawWaveformFrame() {
            if (audioPeaks.length === 0) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerY = canvas.height / 2;

            // Calculate progress ratio (0.0 to 1.0)
            const progress = (audio.currentTime || 0) / (audio.duration || 1);
            const activeBarsCount = Math.floor(progress * totalBars);

            for (let i = 0; i < totalBars; i++) {
                // Minimum bar height 4px rakhenge flat lagne se rokne ke liye
                let h = audioPeaks[i] > 4 ? audioPeaks[i] : 4; 
                const x = i * (barWidth + gap);

                if (i <= activeBarsCount) {
                    // Jo play ho chuka hai uska color (Solid White/Bright)
                    ctx.fillStyle = '#ffffff';
                } else {
                    // Jo abhi play hona baaki hai (Low Opacity)
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                }

                // Bar draw karna
                ctx.fillRect(x, centerY - (h / 2), barWidth, h);
            }
        }

        // Animation loop for smooth transition while playing
        function drawWaveformLoop() {
            if(audio.paused) return;
            isDrawing = true;
            drawWaveformFrame();
            requestAnimationFrame(drawWaveformLoop);
        }

    </script>
</body>
</html>
