<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Glass Audio Player</title>
    <style>
        /* Base Background */
        body {
            background-color: #121212; /* Dark background matching the outer edge */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            user-select: none;
        }

        /* OUTER CONTAINER: Blends with background, large border */
        .outer-shell {
            background: #181818;
            padding: 12px;
            border-radius: 48px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 2px rgba(255, 255, 255, 0.02),
                inset 0 -1px 2px rgba(0, 0, 0, 0.5);
        }

        /* INNER CONTAINER: Glass/Liquid UI effect */
        .inner-glass {
            background: linear-gradient(160deg, #2a2a2c 0%, #161616 100%);
            border: 1px solid rgba(255, 255, 255, 0.08); /* Subtle glass edge */
            border-radius: 36px;
            padding: 35px 25px;
            width: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        canvas {
            width: 100%;
            height: 80px;
            margin-bottom: 25px;
            display: block;
        }

        /* Typography & Info Row */
        .info-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            width: 100%;
        }

        .time-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .red-dot {
            width: 8px;
            height: 8px;
            background: #ff3b30;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 59, 48, 0.6);
            /* animation: pulse 1.5s infinite; */ /* Uncomment for breathing effect */
        }

        .time-display {
            font-size: 32px;
            font-weight: 500;
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
        }

        .status-text {
            font-size: 9px;
            color: #777;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            line-height: 1.3;
            text-align: left;
            font-weight: 600;
        }

        /* Controls Section */
        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 90%;
        }

        .btn {
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        .btn:active {
            transform: scale(0.92);
        }

        /* Dark Glossy Buttons (Left & Right) */
        .dark-btn {
            background: linear-gradient(145deg, #333333, #1f1f1f);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 
                3px 3px 8px rgba(0, 0, 0, 0.4),
                inset 0 1px 1px rgba(255, 255, 255, 0.1);
            width: 48px;
            height: 48px;
            color: white;
        }

        .dark-btn svg {
            fill: none;
            stroke: #ddd;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            width: 18px;
            height: 18px;
        }

        /* Red Pause Button (Center) */
        .red-btn {
            background: #ff3b30;
            width: 60px;
            height: 60px;
            box-shadow: 
                0 8px 20px rgba(255, 59, 48, 0.35),
                inset 0 2px 4px rgba(255, 255, 255, 0.2);
        }

        .red-btn svg {
            fill: white;
            width: 22px;
            height: 22px;
        }

        /* Stop Button Square SVG */
        #stopBtn svg {
            fill: #ddd;
            stroke: none;
            width: 14px;
            height: 14px;
            border-radius: 2px;
        }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="outer-shell">
        <div class="inner-glass">
            <!-- Canvas resolution multiplied for sharpness -->
            <canvas id="waveformCanvas" width="400" height="120"></canvas>
            
            <div class="info-row">
                <div class="time-container">
                    <div class="red-dot"></div>
                    <span class="time-display" id="currentTime">00:00</span>
                </div>
                <div class="status-text" id="statusText">SELECT AUDIO<br>TO PLAY...</div>
            </div>

            <div class="controls">
                <!-- Left Button: Options/Upload (Using Sliders Icon) -->
                <button class="btn dark-btn" id="uploadBtn">
                    <svg viewBox="0 0 24 24">
                        <line x1="4" y1="21" x2="4" y2="14"></line>
                        <line x1="4" y1="10" x2="4" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12" y2="3"></line>
                        <line x1="20" y1="21" x2="20" y2="16"></line>
                        <line x1="20" y1="12" x2="20" y2="3"></line>
                        <line x1="1" y1="14" x2="7" y2="14"></line>
                        <line x1="9" y1="8" x2="15" y2="8"></line>
                        <line x1="17" y1="16" x2="23" y2="16"></line>
                    </svg>
                </button>
                
                <!-- Center Button: Play/Pause -->
                <button class="btn red-btn" id="playPauseBtn">
                    <!-- Play Icon -->
                    <svg id="playIcon" viewBox="0 0 24 24" style="margin-left: 3px;"><path d="M8 5v14l11-7z"/></svg>
                    <!-- Pause Icon (Matching Reference) -->
                    <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;">
                        <rect x="6" y="5" width="4" height="14" rx="1"></rect>
                        <rect x="14" y="5" width="4" height="14" rx="1"></rect>
                    </svg>
                </button>
                
                <!-- Right Button: Stop -->
                <button class="btn dark-btn" id="stopBtn">
                    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg>
                </button>
            </div>

            <input type="file" id="audioInput" accept="audio/*">
        </div>
    </div>

    <script>
        const canvas = document.getElementById('waveformCanvas');
        const ctx = canvas.getContext('2d');
        const audioInput = document.getElementById('audioInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const timeDisplay = document.getElementById('currentTime');
        const statusText = document.getElementById('statusText');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');

        let audioContext, analyser, source;
        const audio = new Audio();
        audio.crossOrigin = "anonymous";

        // WAVEFORM MATH UPDATE (Center-Right Anchor)
        const barWidth = 3;
        const gap = 3.5;
        // Orange bar fixed at 60% of the canvas width
        const activeX = canvas.width * 0.60; 
        const totalBars = Math.floor(activeX / (barWidth + gap));
        const barHistory = new Array(totalBars).fill(2); // Initial flat line
        
        let isDrawing = false;
        let dataArray, bufferLength;

        // 1. Handle File Selection
        uploadBtn.addEventListener('click', () => audioInput.click());

        audioInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const objectUrl = URL.createObjectURL(file);
                audio.src = objectUrl;
                statusText.innerHTML = "NEW AUDIO<br>RECORDING..."; // Changed text to match UI vibe
                timeDisplay.textContent = "00:00";
                
                barHistory.fill(2);
                drawWaveformFrame();
            }
        });

        // 2. Setup Web Audio API
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                source = audioContext.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioContext.destination);
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        // 3. Play / Pause Logic
        playPauseBtn.addEventListener('click', () => {
            if (!audio.src) {
                alert("Please select an audio file first using the left icon.");
                return;
            }

            initAudioContext();

            if (audio.paused) {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                if (!isDrawing) drawWaveform();
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        });

        // 4. Stop Logic
        stopBtn.addEventListener('click', () => {
            audio.pause();
            audio.currentTime = 0;
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
        });

        // Update Timer Text
        audio.addEventListener('timeupdate', () => {
            const current = Math.floor(audio.currentTime);
            const minutes = Math.floor(current / 60).toString().padStart(2, '0');
            const seconds = (current % 60).toString().padStart(2, '0');
            timeDisplay.textContent = `${minutes}:${seconds}`;
        });

        audio.addEventListener('ended', () => {
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            audio.currentTime = 0;
        });

        // 5. Drawing the Waveform (Corrected to Center Anchor)
        function drawWaveformFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const centerY = canvas.height / 2;

            // Draw full width dotted line in background
            ctx.beginPath();
            ctx.setLineDash([2, 5]);
            ctx.moveTo(0, centerY);
            ctx.lineTo(canvas.width, centerY);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.setLineDash([]); // Reset dash for bars

            // Draw the active Orange Bar at fixed position
            const currentHeight = barHistory[barHistory.length - 1] || 2;
            ctx.fillStyle = '#ff3b30'; // Apple-style red/orange
            // Draw orange line with slightly round caps by using small border radius trick (or standard fill)
            ctx.fillRect(activeX, centerY - (currentHeight / 2), barWidth, currentHeight);

            // Draw History Bars (Backwards from activeX)
            for (let i = barHistory.length - 2; i >= 0; i--) {
                const h = barHistory[i];
                // Distance from orange bar
                const distanceIndex = (barHistory.length - 1) - i; 
                const x = activeX - (distanceIndex * (barWidth + gap));

                // Fade out as it moves left
                const alpha = i / barHistory.length; 
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                
                ctx.fillRect(x, centerY - (h / 2), barWidth, h);
            }
        }

        function drawWaveform() {
            isDrawing = true;
            requestAnimationFrame(drawWaveform);

            if (!audio.paused) {
                analyser.getByteTimeDomainData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    let val = (dataArray[i] - 128) / 128;
                    sum += val * val;
                }
                let rms = Math.sqrt(sum / dataArray.length);
                
                // Height scaling 
                let barHeight = rms * 500; 
                if (barHeight < 2) barHeight = 2; // Flat line base height
                if (barHeight > 90) barHeight = 90; // Max canvas limit

                barHistory.shift();
                barHistory.push(barHeight);
            } else {
                // If paused, slowly animate back to flat line
                barHistory.shift();
                barHistory.push(2); 
            }

            drawWaveformFrame();
        }

        drawWaveformFrame();
    </script>
</body>
</html>
